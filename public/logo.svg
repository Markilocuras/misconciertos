<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="misconciertos">
  <!-- Pin: círculo de radio 18 centrado en (32, 27.55) + las dos tangentes que
       bajan a la punta en (32, 54.45). Los puntos de tangencia salen de
       arccos(r/d) con d = 26.9, por eso los 18.62 / 45.38. -->
  <defs>
    <linearGradient id="mc-pin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbb040"/>
      <stop offset="1" stop-color="#ff8a0d"/>
    </linearGradient>
  </defs>
  <path fill="url(#mc-pin)" d="M18.62 39.59A18 18 0 1 1 45.38 39.59L32 54.45Z"/>
  <circle cx="32" cy="27.55" r="8.5" fill="#171c29"/>
</svg>
